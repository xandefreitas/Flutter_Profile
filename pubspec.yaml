name: flutter_profile
description: My personal profile and work history.

# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 2.4.0+37

environment:
  sdk: "^3.7.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  unicons: ^3.0.0
  shared_preferences: ^2.0.15
  intl_phone_field: ^3.1.0
  firebase_auth: ^6.5.7
  firebase_core: ^4.13.0
  firebase_storage: ^13.4.6
  firebase_messaging: ^16.5.0
  cloud_firestore: ^6.8.0
  pinput: ^6.0.2
  dio: ^5.8.0+1
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  url_launcher: ^6.3.1
  path_provider: ^2.1.5
  package_info_plus: ^10.2.1
  flutter_pdfview: ^1.4.0
  share_plus: ^13.3.0
  lottie: ^3.3.1
  cached_network_image: ^3.4.1
  flutter_animate: ^4.5.2
  flutter_native_splash: ^2.4.6
  translator: ^1.0.3
  flutter_markdown_plus: ^1.0.3
  # flutter_launcher_icons: ^0.10.0
  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.2
  firebase_database: ^12.4.7

flutter_native_splash:
  color: "#FFFFFF"
  image: "assets/app/splash_screen.png"
  android: true
  ios: true

# flutter_icons:
#   image_path: "assets/app/icon_ios.jpg"
#   ios: true
#   remove_alpha_ios: true
#   android: "launcher_icon"
#   adaptative_icon_background: "#ffffff"
#   adaptative_icon_foreground: "assets/app/icon.png"

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  bloc_test: ^10.0.0
  firebase_auth_mocks: ^0.15.2
  fake_cloud_firestore: ^4.2.0
  http_mock_adapter: ^0.6.1
  mock_exceptions: ^0.8.2

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter.
flutter:
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  generate: true
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/app/
    - assets/images/
    - assets/lottie/
    - assets/legal/

